
name: Windows latest + Tailscale + RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Validate secrets
        shell: pwsh
        run: |
          if (!$env:TAILSCALE_AUTHKEY) {
            throw "Missing TAILSCALE_AUTHKEY secret"
          }
          if (!$env:RDP_PASSWORD -or $env:RDP_PASSWORD.Length -lt 20) {
            throw "RDP_PASSWORD must be at least 20 characters"
          }

      - name: Configure secure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any

          Start-Service TermService

      - name: Create RDP account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (!(Get-LocalUser RDP -ErrorAction SilentlyContinue)) {
            New-LocalUser RDP -Password $password `
              -Description "Temporary RDP account"
          } else {
            Set-LocalUser RDP -Password $password
            Enable-LocalUser RDP
          }

          $member = Get-LocalGroupMember "Remote Desktop Users" |
            Where-Object { $_.Name -match '\\RDP$' }

          if (!$member) {
            Add-LocalGroupMember "Remote Desktop Users" RDP
          }

          $admin = Get-LocalGroupMember Administrators |
            Where-Object { $_.Name -match '\\RDP$' }

          if ($admin) {
            Remove-LocalGroupMember Administrators RDP
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer

          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'Tailscale') {
            throw "Invalid Tailscale installer signature"
          }

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed"
          }

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID" `
            "--accept-routes=false" `
            "--ssh=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed"
          }

          $ip = $null

          for ($i = 0; $i -lt 30 -and !$ip; $i++) {
            Start-Sleep 2
            $result = & $ts ip -4
            if ($result) {
              $ip = ($result | Select-Object -First 1).Trim()
            }
          }

          if (!$ip) {
            throw "Tailscale IP unavailable"
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: pwsh
        run: |
          if ((Get-Service TermService).Status -ne 'Running') {
            throw "RDP service is not running"
          }

          $listener = Get-NetTCPConnection `
            -State Listen -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (!$listener) {
            throw "RDP listener unavailable"
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"

      - name: Keep runner alive
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "RDP ADDRESS: $env:TAILSCALE_IP"
          Write-Host "USERNAME: RDP"
          Write-Host "PASSWORD: GitHub RDP_PASSWORD secret"
          Write-Host "================================"

          while ($true) {
            Write-Host "[$(Get-Date)] Runner active"
            Start-Sleep -Seconds 300
          }

      - name: Disconnect Tailscale
        if: always()
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $ts) {
            & $ts logout
          }
